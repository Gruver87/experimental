# Single-node prod profile (Docker) — Rust bridge + L1 relayer sidecar
# Usage:
#   $env:JWT_SECRET="<random>"; $env:RPC_API_KEYS="<key>"; $env:BRIDGE_ORACLE_SECRET="<random>"
#   $env:CORS_ORIGINS="https://explorer.example.com"; $env:ETH_RPC_URL="https://..."
#   $env:GENESIS_CEREMONY_HASH="<ceremony_hash from genesis_ceremony.py>"
#   $env:GENESIS_STRICT_MAINNET="true"   # optional: reject placeholder validator addresses
#   .\scripts\docker_prod.ps1
#   python scripts/prod_smoke.py http://127.0.0.1:8080

x-abs-prod-env: &abs-prod-env
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  DEPLOYMENT_MODE: prod
  DATA_DIR: /app/data
  DB_ENGINE: rocksdb
  ROCKSDB_SYNC: FULL
  ROCKSDB_BLOCK_CACHE_MB: "256"
  ROCKSDB_WRITE_BUFFER_MB: "64"
  ROCKSDB_COLUMN_FAMILIES: "true"
  CHAIN_ID: "778888"
  HTTP_HOST: "0.0.0.0"
  RPC_HOST: "0.0.0.0"
  WS_HOST: "0.0.0.0"
  P2P_HOST: "0.0.0.0"
  P2P_MAX_MESSAGE_BYTES: "2097152"
  P2P_MAX_MESSAGES_PER_SEC: "500"
  P2P_BAN_SECONDS: "300"
  P2P_RATE_LIMIT_STRIKES: "5"
  P2P_EVICT_MIN_SCORE: "0"
  ABS_REQUIRE_NATIVE_CRYPTO: "true"
  BRIDGE_MODE: rust
  RUST_BRIDGE_PATH: bridge/abs_bridge_bin
  BRIDGE_AUTO_CONFIRM_SEC: "0"
  BRIDGE_REQUIRE_L1_PROOF: "true"
  BRIDGE_PROBE_L1_RPC: ${BRIDGE_PROBE_L1_RPC:-false}
  BRIDGE_ENABLED: ${BRIDGE_ENABLED:-false}
  BRIDGE_L1_QUEUE_PATH: /app/data/bridge_l1_queue.json
  ETH_RPC_URL: ${ETH_RPC_URL:?set ETH_RPC_URL before starting prod bridge}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before starting prod}
  RPC_API_KEYS: ${RPC_API_KEYS:?set RPC_API_KEYS before starting prod}
  BRIDGE_ORACLE_SECRET: ${BRIDGE_ORACLE_SECRET:?set BRIDGE_ORACLE_SECRET before starting prod}
  RPC_API_KEY_REQUIRED: "true"
  JWT_ENFORCE_ADMIN: "true"
  REQUIRE_WALLET_FILE: "true"
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS before starting prod}
  RATE_LIMIT_RPM: "120"
  GENESIS_CEREMONY_HASH: ${GENESIS_CEREMONY_HASH:-}
  GENESIS_STRICT_MAINNET: ${GENESIS_STRICT_MAINNET:-false}
  VALIDATORS_MANIFEST_PATH: ${VALIDATORS_MANIFEST_PATH:-validators.manifest.mainnet-v1.example.json}

# Prevent unbounded container json logs / Docker VM disk fill on long runs.
x-abs-logging: &abs-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile.prod
    hostname: abs-prod
    ports:
      - "${ABS_DOCKER_RPC_PORT:-8545}:8545"
      - "${ABS_DOCKER_HTTP_PORT:-8080}:8080"
      - "${ABS_DOCKER_P2P_PORT:-5000}:5000"
      - "${ABS_DOCKER_WS_PORT:-8766}:8766"
    environment:
      <<: *abs-prod-env
      NODE_ID: docker-prod-1
    volumes:
      # Named volume for chain store (RocksDB) / logs (Windows bind-mount ./data breaks WAL).
      - abs-prod-data:/app/data
      - ./data/wallet.json:/app/data/wallet.json:ro
      - ./data/validators.manifest.json:/app/data/validators.manifest.json:ro
    mem_limit: 1536m
    cpus: "1.5"
    logging: *abs-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)",
        ]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 90s
    networks:
      - abs-prod
    restart: unless-stopped

  relayer:
    profiles:
      - bridge
    build:
      context: .
      dockerfile: Dockerfile.prod
    command:
      [
        "python",
        "scripts/bridge_relayer.py",
        "--interval",
        "30",
        "--watch-l1",
        "--api",
        "http://node:8080",
      ]
    environment:
      <<: *abs-prod-env
      ABS_API_URL: http://node:8080
    volumes:
      - abs-prod-data:/app/data
      - ./data/wallet.json:/app/data/wallet.json:ro
      - ./data/validators.manifest.json:/app/data/validators.manifest.json:ro
    mem_limit: 512m
    cpus: "0.5"
    logging: *abs-logging
    depends_on:
      node:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "scripts/bridge_relayer.py",
          "--preflight",
          "--api",
          "http://node:8080",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    networks:
      - abs-prod
    restart: unless-stopped

networks:
  abs-prod:
    driver: bridge

volumes:
  abs-prod-data:
