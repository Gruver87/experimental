# Experimental R&D fast lane (Gruver87/experimental).
# Does NOT require tip-v2 48h soak. Full Hybrid Node Checks still run via test.yml.
name: Experimental R&D

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "experimental/**", "rd/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rd-unit:
    name: R&D unit + labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: R&D unit tests
        run: |
          pytest -q \
            tests/unit/test_evm_rpc_compat.py \
            tests/unit/test_long_range_ws.py \
            tests/unit/test_libp2p_adapter.py \
            tests/unit/test_prod_mesh_feature_freeze.py
      - name: Long-Range lab
        run: python scripts/long_range_lab.py
      - name: libp2p lab smoke
        run: python scripts/libp2p_lab_smoke.py
