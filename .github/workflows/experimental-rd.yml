# Experimental R&D fast lane (Gruver87/experimental).
# Does NOT require tip-v2 48h soak. Full Hybrid Node Checks still run via test.yml.
name: Experimental R&D

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "experimental/**", "rd/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rd-unit:
    name: R&D unit + labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: R&D unit tests
        run: |
          pytest -q \
            tests/unit/test_evm_rpc_compat.py \
            tests/unit/test_evm_precompiles.py \
            tests/unit/test_long_range_ws.py \
            tests/unit/test_long_range_wave2.py \
            tests/unit/test_long_range_wave3.py \
            tests/unit/test_libp2p_adapter.py \
            tests/unit/test_libp2p_swarm_lab.py \
            tests/unit/test_dual_stack.py \
            tests/unit/test_prod_mesh_feature_freeze.py
      - name: Long-Range lab
        run: python scripts/long_range_lab.py
      - name: libp2p lab smoke
        run: python scripts/libp2p_lab_smoke.py
      - name: libp2p 2-node dual-stack lab
        run: python scripts/libp2p_two_node_lab.py
      - name: libp2p in-process swarm lab
        run: python scripts/libp2p_swarm_lab.py
      - name: libp2p 3-node swarm lab
        run: python scripts/libp2p_three_node_lab.py
      - name: libp2p request/response lab
        run: python scripts/libp2p_reqresp_lab.py
      - name: libp2p multi-hop relay lab
        run: python scripts/libp2p_relay_lab.py
      - name: libp2p discovery lab
        run: python scripts/libp2p_discovery_lab.py
      - name: libp2p identify lab
        run: python scripts/libp2p_identify_lab.py
      - name: EVM precompile lab
        run: python scripts/evm_precompile_lab.py
      - name: Local R&D verify aggregator
        run: python scripts/verify_experimental_rd.py -q

  rd-libp2p-rust:
    name: ADR 0019 rust-libp2p lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin
      - name: Build abs_native wheel with libp2p feature
        working-directory: native/abs_native
        run: maturin build --release --features "pyo3/extension-module,libp2p"
      - name: Install wheel
        run: |
          set -euo pipefail
          WHL=$(find . -path '*/wheels/abs_native-*.whl' | head -n1)
          test -n "$WHL"
          echo "Installing $WHL"
          python -m pip install --force-reinstall --no-deps "$WHL"
      - name: cargo test libp2p feature
        working-directory: native/abs_native
        run: cargo test --features libp2p --lib
      - name: rust-libp2p 2-node lab
        run: python scripts/libp2p_rust_two_node_lab.py
      - name: rust-libp2p wire lab (Slice B)
        run: python scripts/libp2p_rust_wire_lab.py
      - name: rust-libp2p 3-node metrics lab (Slice B)
        run: python scripts/libp2p_rust_three_node_lab.py
      - name: rust-libp2p soak / dial budget lab (Slice C)
        run: python scripts/libp2p_rust_soak_lab.py
      - name: mixed dual-stack lab (Slice D)
        run: python scripts/libp2p_mixed_dual_stack_lab.py
      - name: rust-libp2p gossipsub lab (Slice E)
        run: python scripts/libp2p_rust_gossip_lab.py
      - name: adapter + wire-bridge units
        run: pytest -q tests/unit/test_libp2p_adapter.py tests/unit/test_libp2p_wire_bridge.py
      - name: package ADR 0019 evidence pack
        run: python scripts/package_libp2p_evidence.py
