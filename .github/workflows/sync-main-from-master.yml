# Keep `main` identical to `master` so GitHub default branch and clones stay aligned.
name: Sync main from master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  # Protect branch `main` via GitHub rules; this job only mirrors master→main.
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Push master to main
        run: git push origin HEAD:main
