name: Security checks

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --desc on

  cargo-audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit native/abs_native
        # Scoped ignores: unused pyo3 APIs + ADR 0019 libp2p transitive (mdns/hickory,
        # stale libp2p-tls lock edges). See .cargo/audit.toml + docs/DEPENDABOT_TRIAGE.md
        run: >
          cargo audit --file native/abs_native/Cargo.lock
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0177
          --ignore RUSTSEC-2026-0119
          --ignore RUSTSEC-2025-0009
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0258

      - name: Audit bridge/rust_bridge
        run: >
          cargo audit --file bridge/rust_bridge/Cargo.lock
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0177

  bridge-off-gate:
    name: Bridge OFF audit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Bridge OFF audit gate
        run: python scripts/bridge_off_audit_gate.py
