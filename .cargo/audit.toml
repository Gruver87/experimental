# cargo-audit project config — industrial harden (2026-08-02)
# Full pyo3 0.22 → 0.29 migration is tracked via Dependabot PR #7 (386+ API breaks).
# These advisories do not apply to call sites we use (no PyString::from_object,
# no PyCFunction::new_closure). Remove ignores when pyo3 >= 0.29 lands.

[advisories]
ignore = [
    # Risk of buffer overflow in PyString::from_object — unused API; fix >=0.24.1
    "RUSTSEC-2025-0020",
    # Missing Sync on PyCFunction::new_closure — unused API; fix >=0.29.0
    "RUSTSEC-2026-0177",
    # rkyv OOB via Rc/Arc archives — optional dep of rust_decimal; our crate uses
    # rust_decimal with default-features=false + features=["std"] only (no rkyv
    # feature). cargo-audit still scans the lock entry. Clear when rust_decimal
    # drops unused optional lock edges or we migrate off decimal serialization paths.
    "RUSTSEC-2026-0235",
    # --- ADR 0019 rust-libp2p opt-in (FEATURE_LIBP2P); prod mesh remains TCP+TLS ---
    # hickory-proto via libp2p-mdns (Slice F LAN discovery). Fix needs hickory>=0.26
    # which libp2p-mdns 0.46 has not adopted. Lab-only; not industrial default mesh.
    "RUSTSEC-2026-0119",
    # ring 0.16 / rustls-webpki 0.101 via stale optional libp2p-tls lock edges
    # (we enable Noise+TCP only; tls/quic/websocket features OFF). Clear when
    # Cargo.lock is regenerated without unused libp2p-tls / rcgen 0.11 edges or
    # when upstream libp2p-tls bumps webpki.
    "RUSTSEC-2025-0009",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27 unbounded empty DATA frames (RUSTSEC-2026-0258, issued 2026-08-18).
    # Comes from hyper 0.14 via igd-next (libp2p UPnP/NAT lab). Patch is h2>=0.4.16
    # which needs hyper 1.x; libp2p 0.54 has not moved that edge. Prod mesh is
    # TCP+TLS (feature_libp2p=false). Clear when libp2p drops hyper 0.14 / igd-next.
    "RUSTSEC-2026-0258",
]
